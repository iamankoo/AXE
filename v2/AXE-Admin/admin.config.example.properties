# Client-safe backend configuration for AXE Admin. Copy the keys below into
# AXE-Admin/local.properties (git-ignored) and fill in your values.
#
# Only PUBLIC values belong here: the Supabase project URL and the anon (public) key.
# NEVER put the service-role key, database password, FCM credentials or signing keys here.
#
# If these keys are absent, the build falls back to ../config/server.json (written by
# v2/backend/scripts/setup-local.mjs): the Supabase URL is derived from its functionsUrl.
#
# Local Supabase from a device/emulator: run `adb reverse tcp:54321 tcp:54321` and keep
# http://127.0.0.1:54321. Cleartext HTTP is permitted for loopback hosts in DEBUG builds only.
axe.supabaseUrl=https://YOUR-PROJECT.supabase.co
axe.anonKey=YOUR-PUBLIC-ANON-KEY
